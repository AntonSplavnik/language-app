<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>German words — Import with photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F3F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #17171C; border: 1px solid #24242B; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Lesson 6</h1>
      <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #9C9BA8">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        2 photos read earlier; their words are kept.
      </p>
    </div>
  </div>

  <ul style="list-style: none; margin: 0; padding: 22px 20px 0; flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start">
    <sc-for list="{{photos}}" as="p" hint-placeholder-count="4">
      <li style="background: #17171C; border: 1px solid #24242B; border-radius: 22px; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="position: relative; height: 128px; border-radius: 16px; background: #E9E6DD; overflow: hidden; display: flex; flex-direction: column; gap: 7px; padding: 16px 14px; box-sizing: border-box">
          <span style="height: 7px; width: 60%; border-radius: 4px; background: #B9B4A8"></span>
          <span style="height: 5px; width: 92%; border-radius: 3px; background: #CFCABF"></span>
          <span style="height: 5px; width: 84%; border-radius: 3px; background: #CFCABF"></span>
          <span style="height: 5px; width: 88%; border-radius: 3px; background: #CFCABF"></span>
          <span style="height: 5px; width: 70%; border-radius: 3px; background: #CFCABF"></span>
          <span style="height: 5px; width: 80%; border-radius: 3px; background: #CFCABF"></span>
          <sc-if value="{{p.dim}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; inset: 0; background: rgba(14,14,17,0.55)"></span>
          </sc-if>
          <sc-if value="{{p.removable}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="Remove photo" style="all: unset; cursor: pointer; position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; background: rgba(14,14,17,0.75); color: #F4F3F7; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
          <span style="{{p.statusStyle}}">
            <sc-if value="{{p.busy}}" hint-placeholder-val="{{ false }}">
              <span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 700ms linear infinite; flex-shrink: 0"></span>
            </sc-if>
            <sc-if value="{{p.ok}}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </sc-if>
            <span>{{p.text}}</span>
          </span>
          <sc-if value="{{p.hasAction}}" hint-placeholder-val="{{ false }}">
            <button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; height: 36px; border-radius: 12px; background: #24242C; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{p.action}}</button>
          </sc-if>
        </div>
      </li>
    </sc-for>
    <li>
      <button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; height: 100%; min-height: 180px; border-radius: 22px; border: 1.5px dashed #3A3A45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
        <span style="width: 48px; height: 48px; border-radius: 16px; background: #D7F26A; color: #14160A; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span style="font-size: 15px; font-weight: 700">Add more photos</span>
      </button>
    </li>
  </ul>

  <div style="padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #1C1C22">
    <button type="button" disabled="disabled" style="all: unset; box-sizing: border-box; height: 60px; border-radius: 20px; background: #1E1E25; color: #8E8D9A; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; cursor: default">
      Review words
      <span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #2A2A33; color: #9C9BA8">13</span>
    </button>
    <span style="text-align: center; font-size: 13px; color: #9C9BA8">Wait until every photo is read</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1.35; ';
    const photos = [
      { kind: 'done', text: '13 words' },
      { kind: 'reading', text: 'Reading' },
      { kind: 'poor', text: 'Couldn’t read much from this page', action: 'Retake' },
      { kind: 'failed', text: '[Error message]', action: 'Retry' }
    ].map((p) => ({
      ...p,
      ok: p.kind === 'done',
      busy: p.kind === 'reading',
      dim: p.kind === 'reading',
      removable: p.kind === 'failed',
      hasAction: !!p.action,
      statusStyle: base + (p.kind === 'done' ? 'color: #D7F26A; font-weight: 700'
        : p.kind === 'reading' ? 'color: #F4F3F7; font-weight: 600'
        : p.kind === 'poor' ? 'color: #F0B45C; font-weight: 600'
        : 'color: #FF8A80; font-weight: 600')
    }));
    return { photos };
  }
}
</script>
</body>
</html>
