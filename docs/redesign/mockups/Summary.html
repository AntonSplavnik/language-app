<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>German words — Session summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F3F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0 4px 6px; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Session done</h1>

    <section aria-label="Results" style="background: #17171C; border: 1px solid #24242B; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 64px; line-height: 0.9; font-weight: 800; letter-spacing: -0.04em; color: #D7F26A">14</span>
        <span style="font-size: 17px; font-weight: 500; color: #9C9BA8">of 20 knew</span>
      </div>
      <div aria-hidden="true" style="display: flex; gap: 4px; height: 10px">
        <span style="flex: 14; border-radius: 999px; background: #D7F26A"></span>
        <span style="flex: 4; border-radius: 999px; background: #FF8A80"></span>
        <span style="flex: 2; border-radius: 999px; background: #3A3A45"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9C9BA8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D7F26A"></span>Knew</span>
          <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">14</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9C9BA8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF8A80"></span>Didn’t know</span>
          <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">4</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9C9BA8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5A5966"></span>Skipped</span>
          <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">2</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 8px 4px 6px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9C9BA8">Words you missed <span style="letter-spacing: 0; font-variant-numeric: tabular-nums">4</span></h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{missed}}" as="m" hint-placeholder-count="4">
          <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 4px; border-bottom: 1px solid #24242B; box-sizing: border-box">
            <span lang="de" style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">
              <sc-if value="{{m.hasArticle}}" hint-placeholder-val="{{ false }}"><span style="{{m.articleStyle}}">{{m.article}} </span></sc-if>{{m.word}}
            </span>
            <span style="font-size: 15px; color: #9C9BA8; text-align: right">{{m.gloss}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>

  <div style="padding: 16px 20px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="Home.dc.html" style="height: 60px; border-radius: 20px; background: #17171C; border: 1px solid #24242B; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; box-sizing: border-box">Home</a>
    <a href="PracticeSetup.dc.html" style="height: 60px; border-radius: 20px; background: #D7F26A; color: #14160A; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -0.01em">New session</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { der: '#7AA7FF', die: '#FF8FA3', das: '#5ED6C4' };
    const missed = [
      ['', 'bezahlen', 'to pay'],
      ['die', 'Miete', 'rent'],
      ['', 'braun', 'brown'],
      ['', 'mögen', 'to like']
    ].map(([article, word, gloss]) => ({
      article, word, gloss,
      hasArticle: !!article,
      articleStyle: 'font-weight: 600; color: ' + (colors[article] || '#9C9BA8')
    }));
    return { missed };
  }
}
</script>
</body>
</html>
