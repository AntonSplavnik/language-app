<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>German words — My words</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input::placeholder{color:#8E8D9A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F3F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #17171C; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <span style="font-size: 13px; font-weight: 600; color: #9C9BA8">149 words</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">My words</h1>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 16px; background: #17171C; border: 1px solid rgba(255,255,255,0.06); box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9C9BA8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
      <input type="search" placeholder="Search German or English" style="all: unset; flex: 1; font-size: 16px; color: #F4F3F7">
    </label>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #17171C; border: 1px solid rgba(255,255,255,0.06)">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{tab.selected}}" onClick="{{tab.pick}}" style="{{tab.style}}">
          <span>{{tab.label}}</span>
          <span style="{{tab.countStyle}}">{{tab.count}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="10">
        <sc-if value="{{w.header}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 14px 4px 6px; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 15px; font-weight: 700; color: #9C9BA8">{{w.letter}}</div>
        </sc-if>
        <a href="Word.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); box-sizing: border-box">
          <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
            <span style="display: flex; align-items: baseline; gap: 7px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">
              <sc-if value="{{w.hasArticle}}" hint-placeholder-val="{{ false }}">
                <span style="{{w.articleStyle}}">{{w.article}}</span>
              </sc-if>
              <span>{{w.word}}</span>
            </span>
            <span style="font-size: 14px; color: #9C9BA8">{{w.gloss}}</span>
          </span>
          <sc-if value="{{w.isNew}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: rgba(215,242,106,0.12); color: #D7F26A">New</span>
          </sc-if>
          <sc-if value="{{w.inProgress}}" hint-placeholder-val="{{ false }}">
            <span aria-label="Streak 0 of 3" style="display: flex; gap: 4px">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: #34343F"></span>
              <span style="width: 8px; height: 8px; border-radius: 50%; background: #34343F"></span>
              <span style="width: 8px; height: 8px; border-radius: 50%; background: #34343F"></span>
            </span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{showEmpty}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 40px 120px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 22px; background: #17171C; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9C9BA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v14H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/></svg>
      </span>
      <span style="font-size: 18px; font-weight: 700">Nothing here yet</span>
      <span style="font-size: 15px; color: #9C9BA8">{{emptyText}}</span>
    </div>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(to bottom, rgba(14,14,17,0), #0E0E11); pointer-events: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'learning' };
  }
  renderVals() {
    const genders = { der: '#7AA7FF', die: '#FF8FA3', das: '#5ED6C4' };
    const raw = [
      ['', 'ab', 'from', 'progress'],
      ['', 'also', 'so', 'progress'],
      ['', 'alt', 'old', 'progress'],
      ['', 'ankreuzen', 'to tick', 'new'],
      ['der', 'Anruf', 'phone call', 'new'],
      ['die', 'Antwort', 'answer', 'new'],
      ['die', 'Anzeige', 'advertisement', 'new'],
      ['das', 'Apartment', 'apartment', 'new'],
      ['die', 'Arbeit', 'work, job', 'new'],
      ['', 'aus', 'from', 'new'],
      ['der', 'Balkon', 'balcony', 'new'],
      ['', 'bei', 'at, with', 'new']
    ];
    let last = '';
    const words = raw.map(([article, word, gloss, status]) => {
      const letter = word[0].toUpperCase();
      const header = letter !== last;
      last = letter;
      return {
        article, word, gloss, letter, header,
        hasArticle: !!article,
        isNew: status === 'new',
        inProgress: status === 'progress',
        articleStyle: 'color: ' + (genders[article] || '#9C9BA8') + '; font-weight: 600'
      };
    });
    const defs = [
      { id: 'learning', label: 'Learning', count: 149 },
      { id: 'learned', label: 'Learned', count: 0 },
      { id: 'ignored', label: 'Ignored', count: 0 }
    ];
    const tabs = defs.map((t) => {
      const on = this.state.tab === t.id;
      return {
        ...t,
        selected: on ? 'true' : 'false',
        pick: () => this.setState({ tab: t.id }),
        style: 'all: unset; box-sizing: border-box; cursor: pointer; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; ' + (on ? 'background: #F4F3F7; color: #0E0E11' : 'color: #9C9BA8'),
        countStyle: 'font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 999px; ' + (on ? 'background: #0E0E11; color: #F4F3F7' : 'background: #26262E; color: #9C9BA8')
      };
    });
    const tab = this.state.tab;
    return {
      tabs,
      words,
      showList: tab === 'learning',
      showEmpty: tab !== 'learning',
      emptyText: tab === 'learned' ? 'Words you master in practice will land here.' : 'Words you choose to skip will show up here.'
    };
  }
}
</script>
</body>
</html>
