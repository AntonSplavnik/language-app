<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>German words — Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #0E0E11; color: #F4F3F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <a href="ImportPhotos.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #17171C; border: 1px solid #24242B; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Lesson 5</h1>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 15px; color: #9C9BA8"><span style="color: #F4F3F7; font-weight: 700">{{total}}</span> new words · <span style="color: #F4F3F7; font-weight: 700">{{adds}}</span> to add</span>
      <span style="display: flex; gap: 6px">
        <button type="button" onClick="{{addAll}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; background: #17171C; border: 1px solid #24242B; display: flex; align-items: center; font-size: 14px; font-weight: 700; box-sizing: border-box">Add all</button>
        <button type="button" onClick="{{skipAll}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; background: #17171C; border: 1px solid #24242B; display: flex; align-items: center; font-size: 14px; font-weight: 700; box-sizing: border-box">Skip all</button>
      </span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="border-radius: 18px; background: #141418; border: 1px solid #222229; overflow: hidden">
      <button type="button" onClick="{{toggleKnown}}" aria-expanded="{{knownOpen}}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #9C9BA8">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span style="flex: 1">4 already in your words</span>
        <span style="{{chevronStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
      </button>
      <sc-if value="{{knownOpen}}" hint-placeholder-val="{{ false }}">
        <p lang="de" style="margin: 0; padding: 0 16px 14px 42px; font-size: 14px; line-height: 1.5; color: #C9C7D2"><span style="color: #FF8FA3">die</span> Garage, <span style="color: #FF8FA3">die</span> Miete, möbliert, <span style="color: #7AA7FF">der</span> Tisch</p>
      </sc-if>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <div style="border-radius: 20px; background: #17171C; border: 1px solid #24242B; overflow: hidden">
        <div style="{{r.rowStyle}}">
          <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
            <span lang="de" style="{{r.wordStyle}}">
              <sc-if value="{{r.hasArticle}}" hint-placeholder-val="{{ false }}"><span style="{{r.articleStyle}}">{{r.article}} </span></sc-if>{{r.lemma}}
            </span>
            <span style="font-size: 14px; color: #9C9BA8">{{r.gloss}} · {{r.pos}}</span>
            <sc-if value="{{r.notInDict}}" hint-placeholder-val="{{ false }}">
              <span style="align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #24242C; color: #9C9BA8">not in dictionary</span>
            </sc-if>
          </span>
          <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.adding}}" aria-label="{{r.label}}" style="{{r.toggleStyle}}">
            <sc-if value="{{r.adding}}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </sc-if>
            {{r.toggleText}}
          </button>
        </div>
        <sc-if value="{{r.mismatchOpen}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; background: rgba(240,180,92,0.12); border-top: 1px solid rgba(240,180,92,0.2)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F0B45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg>
            <span style="flex: 1; font-size: 13px; line-height: 1.4; color: #F0B45C">AI: <strong>der Sofa</strong> · Dictionary: <strong>das Sofa</strong></span>
            <button type="button" onClick="{{r.apply}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 12px; background: #F0B45C; color: #241A08; display: flex; align-items: center; font-size: 14px; font-weight: 700">Use das</button>
          </div>
        </sc-if>
        <sc-if value="{{r.mismatchApplied}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; background: rgba(94,214,196,0.10); border-top: 1px solid rgba(94,214,196,0.18)">
            <span style="flex: 1; font-size: 13px; color: #5ED6C4">Dictionary article applied</span>
            <button type="button" onClick="{{r.undo}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #F4F3F7; display: flex; align-items: center">Undo</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 20px 28px; border-top: 1px solid #1C1C22; background: #0E0E11">
    <button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; height: 60px; border-radius: 20px; background: #D7F26A; color: #14160A; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">{{saveText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { skipped: { 'gemütlich': true }, applied: false, knownOpen: false };
  }
  renderVals() {
    const colors = { der: '#7AA7FF', die: '#FF8FA3', das: '#5ED6C4' };
    const words = [
      ['der', 'Balkon', 'balcony', 'noun'],
      ['', 'gemütlich', 'cosy', 'adjective'],
      ['', 'hell', 'bright', 'adjective'],
      ['die', 'Küche', 'kitchen', 'noun'],
      ['der', 'Sofa', 'sofa', 'noun', 'mismatch'],
      ['', 'umziehen', 'to move (house)', 'verb'],
      ['die', 'Wohnung', 'flat, apartment', 'noun'],
      ['die', 'Wohnungsanzeige', 'flat advertisement', 'noun', 'nodict'],
      ['das', 'Zimmer', 'room', 'noun']
    ];
    const { skipped, applied } = this.state;
    let adds = 0;
    const rows = words.map(([art, lemma, gloss, pos, flag]) => {
      const article = flag === 'mismatch' && applied ? 'das' : art;
      const adding = !skipped[lemma];
      if (adding) adds++;
      return {
        article, lemma, gloss, pos, adding,
        hasArticle: !!article,
        notInDict: flag === 'nodict',
        mismatchOpen: flag === 'mismatch' && !applied,
        mismatchApplied: flag === 'mismatch' && applied,
        label: (adding ? 'Adding ' : 'Skipping ') + (article ? article + ' ' : '') + lemma,
        toggleText: adding ? 'Add' : 'Skip',
        toggle: () => this.setState({ skipped: { ...skipped, [lemma]: adding } }),
        apply: () => this.setState({ applied: true }),
        undo: () => this.setState({ applied: false }),
        rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 12px 12px 18px; box-sizing: border-box; ' + (adding ? '' : 'opacity: 0.55'),
        wordStyle: 'font-size: 18px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; ' + (adding ? '' : 'text-decoration: line-through; text-decoration-color: #9C9BA8'),
        articleStyle: 'font-weight: 600; color: ' + (colors[article] || '#9C9BA8'),
        toggleStyle: 'all: unset; box-sizing: border-box; cursor: pointer; flex-shrink: 0; height: 40px; min-width: 76px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; ' + (adding ? 'background: #D7F26A; color: #14160A' : 'background: #24242C; color: #9C9BA8')
      };
    });
    return {
      rows,
      adds,
      total: words.length,
      knownOpen: this.state.knownOpen,
      chevronStyle: 'display: flex; transition: transform 150ms; ' + (this.state.knownOpen ? 'transform: rotate(180deg)' : ''),
      toggleKnown: () => this.setState({ knownOpen: !this.state.knownOpen }),
      addAll: () => this.setState({ skipped: {} }),
      skipAll: () => this.setState({ skipped: Object.fromEntries(words.map((w) => [w[1], true])) }),
      saveText: adds === 0 ? 'Skip all ' + words.length + ' words' : 'Save ' + adds + (adds === 1 ? ' word' : ' words')
    };
  }
}
</script>
</body>
</html>
