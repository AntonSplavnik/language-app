<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>German words — Flashcard swiping</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F3F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 20px 0; display: flex; align-items: center; gap: 14px">
    <a href="PracticeSetup.dc.html" aria-label="End practice" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #17171C; border: 1px solid #24242B; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F3F7" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #9C9BA8">
        <span>Practice</span>
        <span style="font-variant-numeric: tabular-nums"><span style="color: #F4F3F7">{{n}}</span> / 20</span>
      </div>
      <div style="height: 6px; border-radius: 999px; background: #2A2A33; overflow: hidden">
        <div style="{{barStyle}}"></div>
      </div>
    </div>
  </div>

  <div style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="flex: 1; max-height: 520px; position: relative">
      <div aria-hidden="true" style="position: absolute; inset: 14px 14px -10px; border-radius: 32px; background: #141418; border: 1px solid #202027"></div>
      <div style="{{cardStyle}}">
        <span style="{{stampStyle}}">{{stamp}}</span>
        <span style="font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em">{{word}}</span>
        <span style="font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: #24242C; color: #9C9BA8">{{pos}}</span>
      </div>
    </div>
    <div style="display: flex; justify-content: center; gap: 16px; font-size: 12px; color: #9C9BA8">
      <span>→ knew</span><span>← didn&#39;t know</span><span>↑ skip</span>
    </div>
  </div>

  <div style="padding: 20px 20px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button type="button" aria-label="Didn&#39;t know" style="{{noStyle}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      <span style="font-size: 12px; font-weight: 700">Didn&#39;t know</span>
    </button>
    <button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; height: 64px; border-radius: 20px; background: #17171C; border: 1px solid #24242B; color: #F4F3F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <span style="font-size: 12px; font-weight: 700">Skip</span>
    </button>
    <button type="button" aria-label="Knew it" style="{{yesStyle}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span style="font-size: 12px; font-weight: 700">Knew it</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"direction":{"editor":"enum","options":["knew","didnt"],"default":"knew"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const knew = (this.props.direction ?? 'knew') !== 'didnt';
    const tone = knew ? '#D7F26A' : '#FF8A80';
    const base = 'all: unset; box-sizing: border-box; cursor: pointer; height: 64px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform 120ms; ';
    return {
      n: knew ? 4 : 3,
      word: knew ? 'in the' : 'times',
      pos: knew ? 'preposition' : 'adverb',
      stamp: knew ? 'Knew it' : 'Didn’t know',
      barStyle: 'height: 100%; border-radius: 999px; background: #D7F26A; width: ' + (knew ? '20%' : '15%'),
      cardStyle: 'position: absolute; inset: 0; border-radius: 32px; background: #17171C; border: 2px solid ' + tone + '; box-shadow: 0 30px 70px rgba(0,0,0,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; box-sizing: border-box; text-align: center; transform: ' + (knew ? 'translateX(120px) rotate(10deg)' : 'translateX(-120px) rotate(-10deg)'),
      stampStyle: 'position: absolute; top: 26px; ' + (knew ? 'left: 24px' : 'right: 24px') + '; font-family: \'Bricolage Grotesque\', \'DM Sans\', system-ui, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; padding: 8px 16px; border-radius: 14px; transform: rotate(' + (knew ? '-12deg' : '12deg') + '); ' + (knew ? 'background: #D7F26A; color: #14160A' : 'background: #FF8A80; color: #2A0C08'),
      noStyle: base + (knew ? 'background: rgba(255,122,110,0.14); color: #FF8A80' : 'background: #FF8A80; color: #2A0C08; transform: scale(1.04)'),
      yesStyle: base + (knew ? 'background: #D7F26A; color: #14160A; transform: scale(1.04); box-shadow: 0 0 0 4px rgba(215,242,106,0.22)' : 'background: rgba(215,242,106,0.14); color: #D7F26A')
    };
  }
}
</script>
</body>
</html>
