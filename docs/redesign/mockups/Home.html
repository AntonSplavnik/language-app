<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>German words — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E0E11}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 20px 32px; background: #0E0E11; color: #F4F3F7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9C9BA8">
        <span style="display: inline-flex; padding: 3px 8px; border-radius: 999px; background: #1E1E25; color: #F4F3F7">DE</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span>EN</span>
      </div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">German words</h1>
    </div>
  </header>

  <section style="background: #17171C; border: 1px solid rgba(255,255,255,0.06); border-radius: 28px; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 14px; font-weight: 500; color: #9C9BA8">Your deck</span>
      <span style="font-size: 13px; font-weight: 600; color: #9C9BA8">0% learned</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 64px; line-height: 0.9; font-weight: 800; letter-spacing: -0.04em">149</span>
      <span style="font-size: 17px; font-weight: 500; color: #9C9BA8">words</span>
    </div>
    <div style="height: 8px; border-radius: 999px; background: #26262E; overflow: hidden; display: flex">
      <div style="width: 0%; background: {{accent}}"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9C9BA8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7AA7FF"></span>Learning</span>
        <span style="font-size: 20px; font-weight: 700">149</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9C9BA8"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span>Learned</span>
        <span style="font-size: 20px; font-weight: 700">0</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9C9BA8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5A5966"></span>Ignored</span>
        <span style="font-size: 20px; font-weight: 700">0</span>
      </div>
    </div>
  </section>

  <button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; background: {{accent}}; color: #14160A; border-radius: 28px; padding: 22px 22px 22px 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 120px">
    <span style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; font-size: 32px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Practice</span>
      <span style="font-size: 15px; font-weight: 600; opacity: 0.75">149 words to practise</span>
    </span>
    <span style="width: 60px; height: 60px; border-radius: 50%; background: #14160A; color: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </span>
  </button>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <a href="Words.dc.html" style="background: #17171C; border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 28px; min-height: 140px; box-sizing: border-box">
      <span style="display: flex; align-items: center; justify-content: space-between">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #1E1E25; display: flex; align-items: center; justify-content: center; color: #F4F3F7">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v14H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 8h7M8 11.5h5"/></svg>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9C9BA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 18px; font-weight: 700">My words</span>
        <span style="font-size: 13px; color: #9C9BA8">149 learning · 0 learned</span>
      </span>
    </a>
    <button type="button" style="all: unset; box-sizing: border-box; cursor: pointer; background: transparent; border: 1.5px dashed #3A3A45; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 140px">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #1E1E25; display: flex; align-items: center; justify-content: center; color: #F4F3F7">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 18px; font-weight: 700">New import</span>
        <span style="font-size: 13px; color: #9C9BA8">Add more words</span>
      </span>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D7F26A","options":["#D7F26A","#7AA7FF","#FF8F6B","#B69CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D7F26A' };
  }
}
</script>
</body>
</html>
